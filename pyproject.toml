[project]
name = "jetblack-ksqldb"
version = "0.1.0"
description = "An asyncio client for ksqldb"
authors = [{name = "Rob Blackbourn", email = "rob.blackbourn@gmail.com"}]
readme = "README.md"
dependencies = [
    "httpx[http2]<1,>=0.28.1"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pylint",
    "mypy",
]

[project.urls]
Repository = "https://github.com/rob-blackbourn/jetblack-ksqldb"
Issues = "https://github.com/rob-blackbourn/jetblack-ksqldb/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


# pylint
[tool.pylint.main]
py-version = "3.12"
jobs = 4

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_"]
bad-names = ["foo", "bar", "baz", "toto", "tutu", "tata"]

[tool.pylint."messages control"]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
    "missing-module-docstring",
]

# pytest
[tool.pytest.ini_options]
testpaths = [
    "tests",
]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "function"

# mypy
[tool.mypy]
files = [ "src/jetblack_ksqldb", "tests", "examples" ]

[[tool.mypy.overrides]]
module = "pytest"
ignore_missing_imports = true
